name: devteam CI

# Lint, format, typecheck, unit tests, build and Playwright e2e.
# Commands come from .devteam/config.json so the agents and CI run the same checks.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · format · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Read devteam config
        id: cfg
        run: |
          for k in node_version python_version install_cmd lint_cmd format_check_cmd typecheck_cmd test_cmd build_cmd e2e_cmd; do
            v=$(jq -r --arg k "$k" '.[$k] // ""' .devteam/config.json)
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done

      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.cfg.outputs.node_version || 'lts/*' }}

      - name: Set up Python
        if: hashFiles('pyproject.toml', 'requirements*.txt') != ''
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.cfg.outputs.python_version || '3.12' }}

      - name: Install
        if: steps.cfg.outputs.install_cmd != ''
        env: { CMD: "${{ steps.cfg.outputs.install_cmd }}" }
        run: bash -c "$CMD"

      - name: Lint
        if: steps.cfg.outputs.lint_cmd != ''
        env: { CMD: "${{ steps.cfg.outputs.lint_cmd }}" }
        run: bash -c "$CMD"

      - name: Format check
        if: steps.cfg.outputs.format_check_cmd != ''
        env: { CMD: "${{ steps.cfg.outputs.format_check_cmd }}" }
        run: bash -c "$CMD"

      - name: Typecheck
        if: steps.cfg.outputs.typecheck_cmd != ''
        env: { CMD: "${{ steps.cfg.outputs.typecheck_cmd }}" }
        run: bash -c "$CMD"

      - name: Unit tests
        if: steps.cfg.outputs.test_cmd != ''
        env: { CMD: "${{ steps.cfg.outputs.test_cmd }}", CI: "true" }
        run: bash -c "$CMD"

      - name: Build
        if: steps.cfg.outputs.build_cmd != ''
        env: { CMD: "${{ steps.cfg.outputs.build_cmd }}" }
        run: bash -c "$CMD"

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Has Playwright?
        id: pw
        run: echo "present=$(ls playwright.config.* >/dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.pw.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install
        if: steps.pw.outputs.present == 'true'
        run: |
          CMD=$(jq -r '.install_cmd // "npm ci"' .devteam/config.json)
          bash -c "$CMD"
      - name: Install browsers
        if: steps.pw.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        if: steps.pw.outputs.present == 'true'
        env: { CI: "true" }
        run: |
          CMD=$(jq -r '.e2e_cmd // "npx playwright test"' .devteam/config.json)
          bash -c "$CMD"
      - name: Upload report
        if: failure() && steps.pw.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
